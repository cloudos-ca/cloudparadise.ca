# Pipeline restreint à l'analyse de sécurité.
#
# Auto-DevOps a été retiré volontairement : il embarquait des stages de
# déploiement (review, staging, canary, production, rollouts incrémentaux) qui
# n'ont pas de sens sur une vitrine en cours de développement, et qui peuvent
# tenter un déploiement dès qu'un runner et une cible sont disponibles.
#
# Ne restent que les deux analyses demandées, en lecture seule :
#   - SAST              https://docs.gitlab.com/user/application_security/sast/
#   - Secret Detection  https://docs.gitlab.com/user/application_security/secret_detection/
#
# Les deux templates placent leurs jobs dans le stage `test`.

image:
  name: sonarsource/sonar-scanner-cli:11
  entrypoint: [""]

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

stages:
  - build-sonar


build-sonar:
  stage: build-sonar


  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/

  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.token="${SONAR_TOKEN}"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'dev'