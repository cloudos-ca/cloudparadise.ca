# Pipeline restreint à l'analyse de sécurité.
#
# Auto-DevOps a été retiré volontairement : il embarquait des stages de
# déploiement (review, staging, canary, production, rollouts incrémentaux) qui
# n'ont pas de sens sur une vitrine en cours de développement, et qui peuvent
# tenter un déploiement dès qu'un runner et une cible sont disponibles.
#
# Ne restent que les deux analyses demandées, en lecture seule :
#   - SAST              https://docs.gitlab.com/user/application_security/sast/
#   - Secret Detection  https://docs.gitlab.com/user/application_security/secret_detection/
#
# Les deux templates placent leurs jobs dans le stage `test`.

image:
  name: sonarsource/sonar-scanner-cli:11
  entrypoint: [""]

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

stages:
  - build-sonar


build-sonar:
  stage: build-sonar


  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/

  # Un projet SonarQube par branche.
  #
  # L'édition Community n'analyse qu'une seule branche par projet : sans
  # `sonar.projectKey` distinct, l'analyse de `dev` et celle de `main`
  # atterrissaient toutes deux dans le projet principal et s'écrasaient l'une
  # l'autre. Le tableau affichait alors, au hasard du dernier pipeline passé,
  # l'état d'une branche sous le nom de l'autre.
  #
  # `SONAR_PROJECT_KEY_DEV` est une variable de projet GitLab ; à défaut, on
  # retombe sur la clé de `sonar-project.properties` — le comportement d'avant,
  # jamais un échec de pipeline.
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "dev" ] && [ -n "$SONAR_PROJECT_KEY_DEV" ]; then
        CLE_PROJET="-Dsonar.projectKey=${SONAR_PROJECT_KEY_DEV}"
      else
        CLE_PROJET=""
      fi
      sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.token="${SONAR_TOKEN}" ${CLE_PROJET}
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'dev'