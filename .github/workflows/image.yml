# Image du site Cloud OS (cloudos.ca / cloudparadise.ca) publiée sur ghcr.io en amd64 + arm64 (migration AWS, vague 0). Coolify sur .65 bâtit encore de son côté ; aws-sites tirera cette image (vague 2). Branche dev = site de dev (SITE_ENV=dev cuit au build, cf. Dockerfile).
name: Image

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/cloudos-ca/cloudparadise.ca/app

defaults:
  run:
    shell: bash

jobs:
  build-image:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
          build-args: |
            SITE_ENV=${{ github.ref_name == 'dev' && 'dev' || 'production' }}
      - name: Exporter le digest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          d="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assembler la liste de manifestes
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:${{ github.ref_name }}" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Vérifier les deux plateformes
        run: |
          set -euo pipefail
          out=$(docker buildx imagetools inspect "$IMAGE:${{ github.sha }}")
          echo "$out"
          grep -q 'linux/amd64' <<<"$out"
          grep -q 'linux/arm64' <<<"$out"
