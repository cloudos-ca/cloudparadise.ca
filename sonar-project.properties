sonar.projectKey=patricia_cloudparadise.ca_d1f2838f-9f44-41bd-a412-e03c7fd0adf4
sonar.qualitygate.wait=true

# Le miroir anglais n'est pas du copier-coller.
#
# `app/en/**` reprend volontairement la structure de son équivalent français :
# c'est ce qui garantit que les deux versions restent alignées, et c'est la
# règle de travail du projet. Mesurée comme de la duplication, cette symétrie
# faisait grimper l'indicateur à 32,8 % et rendait le quality gate rouge en
# permanence, sur un fait qui n'est pas un défaut.
#
# On corrige la mesure, pas le seuil : le seuil de 3 % reste en vigueur pour
# le vrai code dupliqué, celui qu'on veut effectivement voir signaler.
#
# `content/*.en.ts` relève exactement du même raisonnement, et l'exclusion
# l'avait oublié : le contenu par langue ne vit pas dans `app/en/`, il vit dans
# `content/`. Ces deux fichiers portaient à eux seuls l'essentiel de la mesure
# — `pme.fr.ts` à 75,6 % et `pme.en.ts` à 68,5 %, loin devant tout le reste —
# pour la même symétrie voulue : ce sont deux textes distincts (le français
# vend la proximité, l'anglais la souveraineté), pas une traduction, mais ils
# partagent la structure qui garantit qu'aucune section ne manque d'un côté.
#
# Seule la version anglaise est exclue, comme pour les pages : le français
# reste mesuré, et c'est lui la référence.
sonar.cpd.exclusions=app/en/**,content/*.en.ts
