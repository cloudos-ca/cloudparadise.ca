sonar.projectKey=patricia_cloudparadise.ca_d1f2838f-9f44-41bd-a412-e03c7fd0adf4
sonar.qualitygate.wait=true

# Le miroir anglais n'est pas du copier-coller.
#
# `app/en/**` reprend volontairement la structure de son équivalent français :
# c'est ce qui garantit que les deux versions restent alignées, et c'est la
# règle de travail du projet. Mesurée comme de la duplication, cette symétrie
# faisait grimper l'indicateur à 32,8 % et rendait le quality gate rouge en
# permanence, sur un fait qui n'est pas un défaut.
#
# On corrige la mesure, pas le seuil : le seuil de 3 % reste en vigueur pour
# le vrai code dupliqué, celui qu'on veut effectivement voir signaler.
sonar.cpd.exclusions=app/en/**
