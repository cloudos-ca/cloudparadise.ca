name: CI

on:
  push:
    branches: [main, dev, ci/pipeline-verifications]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: dev-host
    # node:22-bookworm et non -slim : actions/checkout est une action JS qui a besoin de node ET de
    # git dans le conteneur du job, et git est absent des images slim.
    container:
      image: node:22-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/cache@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - run: ./.forgejo/npm-ci.sh
      - run: npm run lint

  types:
    runs-on: dev-host
    container:
      image: node:22-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/cache@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - run: ./.forgejo/npm-ci.sh
      - run: npx tsc --noEmit

  build:
    runs-on: dev-host
    container:
      image: node:22-bookworm
    env:
      # Même valeur que le Dockerfile de production : le code lit SITE_ENV pour décider quoi rendre,
      # et bâtir avec une autre valeur validerait un site différent de celui qu'on livre.
      SITE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/cache@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - run: ./.forgejo/npm-ci.sh
      - run: npm run build
