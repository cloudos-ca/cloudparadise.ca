name: security
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    runs-on: docker
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - name: checkout
        run: git clone --depth=1 --branch "${GITHUB_REF_NAME}" "https://forge.cloudparadise.dev/${GITHUB_REPOSITORY}" .
      - run: gitleaks detect --source . --redact --no-git
        continue-on-error: true

  sast:
    runs-on: docker
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: checkout
        run: git clone --depth=1 --branch "${GITHUB_REF_NAME}" "https://forge.cloudparadise.dev/${GITHUB_REPOSITORY}" .
      - run: semgrep --config auto .
        continue-on-error: true

  dependencies:
    runs-on: docker
    container:
      image: aquasec/trivy:latest
    steps:
      - name: checkout
        run: git clone --depth=1 --branch "${GITHUB_REF_NAME}" "https://forge.cloudparadise.dev/${GITHUB_REPOSITORY}" .
      - run: trivy fs --severity HIGH,CRITICAL --ignore-unfixed .
        continue-on-error: true

  docker-config:
    runs-on: docker
    container:
      image: aquasec/trivy:latest
    steps:
      - name: checkout
        run: git clone --depth=1 --branch "${GITHUB_REF_NAME}" "https://forge.cloudparadise.dev/${GITHUB_REPOSITORY}" .
      - run: trivy config --severity HIGH,CRITICAL .
        continue-on-error: true
