name: security
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    runs-on: docker
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - uses: actions/checkout@v4
      - run: gitleaks detect --source . --redact
        continue-on-error: true

  sast:
    runs-on: docker
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - run: semgrep --config auto .
        continue-on-error: true

  dependencies:
    runs-on: docker
    container:
      image: aquasec/trivy:latest
    steps:
      - uses: actions/checkout@v4
      - run: trivy fs --severity HIGH,CRITICAL --ignore-unfixed .
        continue-on-error: true

  docker-config:
    runs-on: docker
    container:
      image: aquasec/trivy:latest
    steps:
      - uses: actions/checkout@v4
      - run: trivy config --severity HIGH,CRITICAL .
        continue-on-error: true
